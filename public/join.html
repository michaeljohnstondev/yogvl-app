<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Big Vibe Studios | Stay Connected</title>
    <meta name="description" content="Join the Big Vibe Studios community. Get updates on new features, events, and ways to connect.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #000814 0%, #001d3d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 50px;
            text-align: center;
        }

        .logo {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #00D4FF 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #00ff88;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .form-container {
            margin: 40px 0;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #00D4FF;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        input[type="email"]::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00D4FF 0%, #00ff88 100%);
            color: #000814;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            color: #00ff88;
        }

        .error-message {
            display: none;
            background: rgba(255, 100, 100, 0.1);
            border: 2px solid #ff6464;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            color: #ff6464;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #00D4FF;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .logo {
                font-size: 1.8em;
            }

            h1 {
                font-size: 1.8em;
            }

            p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="logo" style="text-decoration: none; display: block;">BIG VIBE STUDIOS</a>
        <h1>Join the Movement</h1>
        <p>
            Stay connected with Big Vibe Studios. Get updates on new features,
            community events, and be part of something bigger.
        </p>

        <div class="form-container">
            <form id="mailingListForm">
                <input
                    type="email"
                    id="emailInput"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                />
                <button type="submit" id="submitBtn">Join Now</button>
            </form>

            <div class="success-message" id="successMessage">
                <strong>Welcome to the community!</strong><br>
                Check your email to confirm your subscription.
            </div>

            <div class="error-message" id="errorMessage">
                <strong>Oops!</strong><br>
                Something went wrong. Please try again.
            </div>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAzPw31ftyHFvAmfJEF0ohFEun7T68tF8c",
            authDomain: "bigvibestudios-b9839.firebaseapp.com",
            projectId: "bigvibestudios-b9839",
            storageBucket: "bigvibestudios-b9839.firebasestorage.app",
            messagingSenderId: "824215388091",
            appId: "1:824215388091:web:2a800abb59b72cdeae8e9e",
            measurementId: "G-7MNJ7HD4F8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('mailingListForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Joining...';

            // Hide previous messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';

            try {
                console.log('[Join] Attempting to add email:', email);

                // Add new email to mailing list (skip duplicate check for now to simplify)
                const mailingListRef = collection(db, 'mailingList');
                console.log('[Join] Adding document to Firestore...');

                await addDoc(mailingListRef, {
                    email: email,
                    subscribedAt: serverTimestamp(),
                    source: 'website-join-page'
                });

                console.log('[Join] Successfully added email to mailing list');

                // Show success message
                successMessage.style.display = 'block';
                document.getElementById('emailInput').value = '';
                submitBtn.textContent = 'Joined!';

                // Reset button after 3 seconds
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Join Now';
                }, 3000);

            } catch (error) {
                console.error('[Join] Error adding email to mailing list:', error);
                console.error('[Join] Error code:', error.code);
                console.error('[Join] Error message:', error.message);

                // Show error message with details
                errorMessage.innerHTML = `<strong>Oops!</strong><br>${error.message || 'Something went wrong. Please try again.'}`;
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Join Now';
            }
        });
    </script>
</body>
</html>
